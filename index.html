<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#123a88"><title>Bluebench Player v0.5</title><style>body{margin:0;background:#07172f;color:white;font-family:system-ui,sans-serif}main{max-width:620px;margin:auto;padding:20px}h1{font-size:23px}p{color:#cbd7ec;line-height:1.6}.panel{background:#142a4c;border-radius:16px;padding:17px;margin:16px 0}select,button,a.action{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;font-size:16px;margin:7px 0}select{background:#fff;color:#111}button,a.action{background:#43a7ff;border:0;color:#07172f;font-weight:bold;cursor:pointer;text-align:center;display:block;text-decoration:none}a.secondary{background:#263e62;color:#fff}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}.small{font-size:13px;color:#b6c8e6}.tag{display:inline-block;background:#315381;border-radius:20px;padding:4px 10px;font-size:12px}#player{display:none}h2{font-size:18px}</style></head><body><main><h1>🐉 ドラゴンズ応援歌</h1><p>Ver.0.5｜選手を選んで1曲ずつ再生。追加した5選手は歌声付きメドレーの該当部分を再生します。</p><div class="panel"><label for="song">応援歌を選ぶ（背番号つき）</label><select id="song"></select><button id="play">▶ この曲を再生する</button><div id="player"><h2 id="name"></h2><p class="small" id="source"></p><iframe id="video" title="YouTubeプレイヤー" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><a id="youtube" class="action secondary" target="_blank" rel="noopener noreferrer">YouTubeで開く</a><div class="small" id="status"></div></div><div class="panel"><span class="tag">音源について</span><p class="small">石川昂弥の2曲は前バージョンの動画を引き継ぎました。新たな5選手は「けさらん」さんの2026年歌声付きメドレーから、該当部分を指定して再生します（応援団公式動画ではありません）。動画の埋め込み設定によっては再生できない場合があります。</p><a class="action secondary" href="https://chunichiouendan.wixsite.com/dragonsouendan/%E5%BF%9C%E6%8F%B4%E6%AD%8C" target="_blank" rel="noopener noreferrer">応援団公式の曲一覧を見る</a></div><p class="small">※動画はYouTubeからオンライン再生。音声の抽出・保存はしません。公開ページはURLを知らない第三者も閲覧できます。</p></main><script>
const medley='GjbssVf4zNo';
const songs=[
{name:'1 岡林勇希',id:medley,start:0,end:28,source:'2026年 歌声付きメドレー（けさらん）'},
{name:'9 石伊雄太',id:medley,start:188,end:215,source:'2026年 歌声付きメドレー（けさらん）'},
{name:'24 ジェイソン・ボスラー',id:medley,start:241,end:269,source:'2026年 歌声付きメドレー（けさらん）'},
{name:'25 石川昂弥（2026年版）',id:'WmzCE70fB_Y',source:'従来の登録動画'},
{name:'25 石川昂弥（2023年版）',id:'d8QVw6bvyEw',source:'従来の登録動画'},
{name:'42 ブライト健太',id:medley,start:457,end:484,source:'2026年 歌声付きメドレー（けさらん）'},
{name:'55 細川成也',id:medley,start:591,end:623,source:'2026年 歌声付きメドレー（けさらん）'}
];
const sel=document.getElementById('song'),player=document.getElementById('player'),video=document.getElementById('video'),link=document.getElementById('youtube');
songs.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.name;sel.appendChild(o)});
function url(s){return 'https://www.youtube.com/watch?v='+encodeURIComponent(s.id)+(s.start!==undefined?'&t='+s.start+'s':'')}
function update(){const s=songs[Number(sel.value)];link.href=url(s);document.getElementById('status').textContent='選択中：'+s.name;}
sel.addEventListener('change',()=>{video.removeAttribute('src');player.style.display='none';update()});
document.getElementById('play').addEventListener('click',()=>{const s=songs[Number(sel.value)];document.getElementById('name').textContent=s.name;document.getElementById('source').textContent='音源：'+s.source;const params=new URLSearchParams({playsinline:'1',rel:'0'});if(s.start!==undefined){params.set('start',String(s.start));params.set('end',String(s.end))}video.src='https://www.youtube.com/embed/'+encodeURIComponent(s.id)+'?'+params.toString();player.style.display='block';player.scrollIntoView({behavior:'smooth',block:'nearest'});});update();
</script></body></html>
