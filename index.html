<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#123a88"><title>Bluebench Player</title><style>body{margin:0;background:#07172f;color:white;font-family:system-ui,sans-serif}main{max-width:620px;margin:auto;padding:22px}h1{font-size:23px}p{color:#cbd7ec;line-height:1.6}.panel{background:#142a4c;border-radius:16px;padding:17px;margin:16px 0}select,button,a.action{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;font-size:16px;margin:7px 0}select{background:#fff;color:#111}button,a.action{background:#43a7ff;border:0;color:#07172f;font-weight:bold;cursor:pointer;text-align:center;display:block;text-decoration:none}button.secondary,a.secondary{background:#263e62;color:#fff}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}.small{font-size:13px;color:#b6c8e6}.tag{display:inline-block;background:#315381;border-radius:20px;padding:4px 10px;font-size:12px}#player{display:none}</style></head><body><main><h1>🐉 ドラゴンズ応援歌</h1><p>1曲再生のテスト版。動画が表示されたら中央の再生ボタンを押してください。</p><div class="panel"><label for="song">応援歌を選ぶ</label><select id="song"></select><button id="play">▶ 再生する</button><div id="player"><h2 id="name"></h2><iframe id="video" title="YouTube公式プレイヤー" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><a id="youtube" class="action secondary" target="_blank" rel="noopener">YouTubeアプリで開く</a><div class="small" id="status"></div></div><div class="panel"><span class="tag">公式の応援歌一覧</span><p>公式チャンネルに動画がある曲を順次追加予定。未登録の曲は、応援団の公式サイトから確認できます。</p><a class="action secondary" href="https://chunichiouendan.wixsite.com/dragonsouendan/%E5%BF%9C%E6%8F%B4%E6%AD%8C" target="_blank" rel="noopener">応援団公式の曲一覧を見る</a></div><p class="small">※ このページはURLを知る人以外にもアクセス可能です。音声を無断保存・抽出しません。YouTubeの動画はオンライン再生です。iPhoneでは再生ボタンをもう一度押す必要がある場合があります。</p></main><script>const songs=[{name:'石川昂弥（2026年版）',id:'WmzCE70fB_Y'},{name:'石川昂弥（2023年版）',id:'d8QVw6bvyEw'}];const sel=document.getElementById('song'),player=document.getElementById('player'),video=document.getElementById('video'),link=document.getElementById('youtube');songs.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.name;sel.appendChild(o)});function update(){const s=songs[+sel.value];link.href='https://www.youtube.com/watch?v='+s.id;document.getElementById('status').textContent='選択中：'+s.name;}sel.addEventListener('change',()=>{video.src='';player.style.display='none';update()});document.getElementById('play').addEventListener('click',()=>{const s=songs[+sel.value];document.getElementById('name').textContent=s.name;video.src='https://www.youtube.com/embed/'+s.id+'?playsinline=1&rel=0';player.style.display='block';player.scrollIntoView({behavior:'smooth',block:'nearest'})});update();</script></body></html>
